---
version: 2
updates:
  # pinact pins every action to a commit SHA with the version as a comment,
  # and Dependabot updates both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release, so a compromised or broken version has
    # time to be pulled before it is proposed.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
