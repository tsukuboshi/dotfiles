---
name: Setup Dotfiles

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make:
    name: Make
    runs-on: macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dotfiles
        run: make

  ast-grep:
    name: ast-grep rule tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # make does not install the mise tools, so the CLI comes from npm at
      # the version pinned in runtime/config.toml.
      - name: Test ast-grep rules
        run: >-
          npx --yes --package @ast-grep/cli@0.51.0 --
          ast-grep test -c genai/lint/ast-grep/sgconfig.yml --skip-snapshot-tests
