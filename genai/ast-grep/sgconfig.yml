---
# Custom rules for what ruff, shellcheck and the other linters do not check.
# The post-edit and pre-commit hooks pass this file with --config to projects
# without their own sgconfig.yml.
# Run the rule tests with:
#   ast-grep test -c genai/ast-grep/sgconfig.yml --skip-snapshot-tests
ruleDirs:
  - rules
testConfigs:
  - testDir: rule-tests
