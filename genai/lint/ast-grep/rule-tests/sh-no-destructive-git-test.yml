---
id: sh-no-destructive-git
valid:
  - git switch main
  - git stash -u
  - git reset HEAD~1
  - git branch -d feature
  - git push --force-with-lease --force-if-includes
  - git push origin main
invalid:
  - git checkout main
  - git checkout -- file.txt
  - git restore file.txt
  - git clean -fd
  - git reset --hard HEAD
  - git branch -D feature
  - git push --force origin main
  - git push -f
