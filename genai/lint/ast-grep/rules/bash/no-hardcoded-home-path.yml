---
id: sh-no-hardcoded-home-path
language: Bash
severity: warning
message: Build this path from the HOME variable or read it from an environment variable.
note: >-
  A path under one user's home directory breaks on every other machine and
  leaks the user name when the script is published (skills/prepare-oss/SKILL.md).
  Use `$HOME/...` or `~/...`, an environment variable, or a gitignored *.local.* file.
rule:
  any:
    - kind: word
    - kind: string_content
    - kind: raw_string
  regex: /(Users|home)/[^/\s"'{}$]+/
  not:
    regex: /home/runner/
