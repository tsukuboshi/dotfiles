onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[keys]
new_tab = ["prefix+c", "ctrl+shift+up"]
close_tab = ["prefix+shift+x", "ctrl+shift+down"]
previous_tab = ["prefix+p", "shift+left"]
next_tab = ["prefix+n", "shift+right"]
previous_workspace = ["shift+up"]
next_workspace = ["shift+down"]

[ui]
prompt_new_tab_name = false
status_indicators = "symbols"
window_title = "{workspace}: {terminal_title}"
